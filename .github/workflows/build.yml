name: Build Jarvis APK

on:
  push:
    branches: [main]
    paths-ignore: ['web/**', '.github/workflows/pages.yml', 'README.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Jarvis-1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-1.0-apk
          path: Jarvis-1.0.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Jarvis 1.0
          body: |
            Jarvis 1.0 — free AI assistant for Android.
            Download **Jarvis-1.0.apk** below on your phone, open it and allow "install unknown apps".
          files: Jarvis-1.0.apk
          make_latest: true

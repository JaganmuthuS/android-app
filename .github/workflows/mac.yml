name: Build JARVIS for Mac

on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mac/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build universal DMG (ad-hoc signed, not notarised)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Collect DMG
        run: cp release/*.dmg ../JARVIS-mac.dmg
      - name: Build Apple silicon-only DMG (smaller download)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          rm -rf release
          npx electron-builder --mac dmg --arm64
          cp release/*.dmg ../JARVIS-mac-apple-silicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-mac
          path: |
            JARVIS-mac.dmg
            JARVIS-mac-apple-silicon.dmg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v0.1
          name: JARVIS for Mac (Phase 1 preview)
          body: |
            Phase 1 preview: the full JARVIS workspace with sample data and the board-report walkthrough.
            Download **JARVIS-mac-apple-silicon.dmg** (M1 or newer) or **JARVIS-mac.dmg** (any Mac), open it and drag JARVIS to Applications.
            The first time, macOS will block it because it is not notarised: open System Settings → Privacy & Security and click **Open Anyway**.
          files: |
            JARVIS-mac.dmg
            JARVIS-mac-apple-silicon.dmg
          make_latest: false

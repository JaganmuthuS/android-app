name: Build JARVIS for Mac

on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mac/package-lock.json
      - run: npm ci
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: npm test
      - name: Build universal DMG (ad-hoc signed, not notarised)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: End-to-end tests (development build, fake Ollama)
        run: npx playwright test
      - name: End-to-end tests (the packaged app itself)
        env:
          E2E_APP_PATH: release/mac-universal/JARVIS.app/Contents/MacOS/JARVIS
        run: npx playwright test
      - name: Collect universal DMG and update zip
        run: |
          cp release/*-universal.dmg ../JARVIS-mac.dmg
          cp release/*-universal-mac.zip ../JARVIS-mac.zip
      - name: Build Apple silicon-only DMG and update zip (smaller downloads)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          rm -rf release
          npx electron-builder --mac dmg zip --arm64
          cp release/*.dmg ../JARVIS-mac-apple-silicon.dmg
          cp release/*-mac.zip ../JARVIS-mac-apple-silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-mac
          path: |
            JARVIS-mac.dmg
            JARVIS-mac-apple-silicon.dmg
            JARVIS-mac.zip
            JARVIS-mac-apple-silicon.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v${{ steps.version.outputs.version }}
          name: JARVIS for Mac ${{ steps.version.outputs.version }}
          body: |
            Phase 4: Word, Excel, PowerPoint and PDF. Jarvis reads all four, edits Word as tracked changes, changes Excel cells while keeping formatting and formulas, and changes PowerPoint text. New: in-app updates (Settings → Updates, or the Update button in the title bar).
            First install: download JARVIS-mac-apple-silicon.dmg (Apple silicon) or JARVIS-mac.dmg (any Mac) and drag JARVIS to Applications. After that, update from inside the app. The .zip files are what the in-app updater downloads.
          files: |
            JARVIS-mac.dmg
            JARVIS-mac-apple-silicon.dmg
            JARVIS-mac.zip
            JARVIS-mac-apple-silicon.zip
          make_latest: false

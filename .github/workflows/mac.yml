name: Build JARVIS for Mac

on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mac/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build universal DMG (ad-hoc signed, not notarised)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: End-to-end tests (real app, fake Ollama)
        run: npx playwright test
      - name: Collect DMG
        run: cp release/*.dmg ../JARVIS-mac.dmg
      - name: Build Apple silicon-only DMG (smaller download)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          rm -rf release
          npx electron-builder --mac dmg --arm64
          cp release/*.dmg ../JARVIS-mac-apple-silicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-mac
          path: |
            JARVIS-mac.dmg
            JARVIS-mac-apple-silicon.dmg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v0.3.4
          name: JARVIS for Mac 0.3.4 (Phase 3 + file access fixes)
          body: |
            Phase 3 preview: choose a workspace folder and set access per folder. Jarvis reads text, Markdown, CSV and Word files, edits text and Markdown files as reviewable changes with inline diffs, saves a checkpoint before every step, and can restore any checkpoint. Files tab and CSV audit log included. 0.3.1: Jarvis can create folders; new top-level folders follow the main folder's access; choosing a workspace asks what access to give; a Set all control; folders made in Finder appear when you return to the app. 0.3.2: understands more of the ways local models name tools and paths, explains every blocked action in the Files tab, and shows the version in Settings. 0.3.3: asks macOS for folder permission properly and explains when macOS blocks it, adds Settings → Check file access with a copyable report, gives the model a map of readable files and reads files you name, and shows a banner when changes wait for you. 0.3.4: simple actions such as creating a folder run at once (you still accept the change) instead of becoming a plan, and only steps that send, publish, delete or export wait for approval.
            Download **JARVIS-mac-apple-silicon.dmg** (M1 or newer) or **JARVIS-mac.dmg** (any Mac), open it and drag JARVIS to Applications.
            The first time, macOS will block it because it is not notarised: open System Settings → Privacy & Security and click **Open Anyway**.
          files: |
            JARVIS-mac.dmg
            JARVIS-mac-apple-silicon.dmg
          make_latest: false
